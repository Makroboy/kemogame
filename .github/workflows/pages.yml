name: Deploy KemoGame
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: kemogame-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out game
        uses: actions/checkout@v6
      - name: Check MIDI routing
        run: node source/tests/check-midi.mjs
      - name: Check browser control cues
        run: node source/tests/check-game-cues.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Allow uploaded artifact metadata to propagate
        run: sleep 15
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
